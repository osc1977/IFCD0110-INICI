<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>

    <!--  ==================================================
    LIBRERIAS
    ==================================================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--  ==================================================
    HOJAS DE ESTILO
    ==================================================== -->
    <link rel="stylesheet" href="./css/Template-GRID.css">
    <link rel="stylesheet" href="./css/sty-form.css">

    <link rel="icon" href="./img/logo.svg" type="image/x-icon" />
</head>
    
<body>
    
    <header>
        Formulario Buscador
    </header>
        
    <main>

        <div>
            <h1>Buscar habitación</h1>
        
            <form action="./F2-Listado.html" method="get" target="_blank">

                <!-- ========================================
                LUGAR
                ======================================== -->
                <div class="form-filas">
                    <label for="lugar">Lugar</label>
                    <input
                        type="text"
                        id="lugar"
                        name="lugar"
                        placeholder="Ej. Barcelona"
                        size="40"
                        pattern="[A-Za-z]{3,40}" 
                        title="Pon la ciudad"
                        required
                        tabindex="1">
                </div>

                <!-- ========================================
                FECHAS DE ENTRADA Y SALIDA
                ======================================== -->
                <div>
                    <div class="form-filas">
                        <label for="entrada">Fecha de entrada</label>
                        <input
                            type="date"
                            id="entrada"
                            name="entrada"
                            title="Pon la fecha de entrada"
                            required
                            tabindex="2">
                    </div>
            
                    <div class="form-filas">
                        <label for="salida">Fecha de salida</label>
                        <input
                            type="date"
                            id="salida"
                            name="salida"
                            title="Pon la fecha de salida"
                            required
                            tabindex="3">
                    </div>
                </div>

                <!-- ========================================
                NUMERO DE ADULTOS Y NIÑOS
                ======================================== -->
                <div>
                    <div class="form-filas">
                        <label for="adultos">Número de adultos</label>
                        <select 
                            id="adultos" 
                            name="adultos" 
                            title="Cuantos adultos serán" 
                            tabindex="4">
                                <option value="1">1</option>
                                <option value="2" selected>2</option>
                                <option value="3">3</option>
                                <option value="4">4+</option>
                        </select>
                    </div>

                    <div class="form-filas">
                        <label for="ninos">Número de niños</label>
                        <select 
                            id="ninos" 
                            name="ninos" 
                            title="Cuantos niños serán" 
                            tabindex="5">
                                <option value="0" selected>0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5+</option>
                        </select>
                    </div>
                    
                    <!-- ========================================
                    BOTON SUBMIT
                    ======================================== -->
                    <button type="submit" tabindex="6">
                        Buscar Habitaciones
                    </button>

                </div>

                <div>
                                    
                    <!-- ========================================
                    UBICACION DEL MAPA
                    ======================================== -->
                    <h2>Ubicación</h2>
            
                    <iframe                    
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d48423.726707879556!2d1.6556691208801337!3d41.346222491619756!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a4798adfdbf557%3A0x136fbb2ddafe4438!2s08720%20Vilafranca%20del%20Pened%C3%A8s%2C%20Barcelona!5e1!3m2!1ses!2ses!4v1780414411457!5m2!1ses!2ses" loading="lazy" width="300" height="150" style="border:0;" allowfullscreen="" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
            
                </div>


            </form>
        </div>
   

    </main>
        
    <footer>
        · © (2026) · Desenvolupado por Oscar · Todos los derechos reservados ·
    </footer>
    
</body>
    
</html>
