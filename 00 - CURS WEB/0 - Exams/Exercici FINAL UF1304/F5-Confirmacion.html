<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmacion</title>

    <!--  ==================================================
    LIBRERIAS
    ==================================================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--  ==================================================
    HOJAS DE ESTILO
    ==================================================== -->
    <link rel="stylesheet" href="./css/Template-GRID.css">
    <link rel="stylesheet" href="./css/sty-form.css">

    <link rel="icon" href="./img/logo.svg" type="image/x-icon" />
</head>
    
<body>
    
    <header>
        Formulario Confirmación de la reserva
    </header>
        
    <main>

        <div class="caixa-form-gr">

            <form action="./F6-Opinion.html" method="get" target="_blank">

                <h1>Confirmación de Reserva</h1>

                <section>
                    <h2>Código de descuento</h2>

                    <!-- ========================================
                    CODIGO DE DESCUENTO
                    ======================================== -->
                    <div class="form-filas">
                        <label for="descuento">Código promocional</label>
                        <input
                            type="text"
                            id="descuento"
                            name="descuento"
                            placeholder="Ej. VERANO2026"
                            tabindex="1">
                    </div>
                </section>

                <section>
                    <h2>Datos de pago</h2>

                    <div>

                        <!-- ========================================
                        DATOS DE LA TARJETA
                        ======================================== -->
                        <div class="form-filas">
                            <label for="titular">Titular de la tarjeta</label>
                            <input
                                type="text"
                                id="titular"
                                name="titular"
                                size="15" 
                                minlength="2" 
                                maxlength="15" 
                                placeholder="" 
                                required 
                                pattern="[A-Za-z]{2,15}" 
                                title="Nombre del titular"
                                tabindex="2">
                        </div>
                        
                        <div class="doble-col">
                            <div class="form-filas">
                                <label for="tipoTarjeta">Tipo de tarjeta</label>
                                <select 
                                    id="tipoTarjeta" 
                                    name="tipoTarjeta" 
                                    required
                                    tabindex="3">
                                        <option value="">Seleccione...</option>
                                        <option>Visa</option>
                                        <option>Mastercard</option>
                                        <option>American Express</option>
                                </select>
                            </div>
                            
                            <div class="form-filas">
                                <label for="numeroTarjeta">Número de tarjeta</label>
                                <input
                                    type="text"
                                    id="numeroTarjeta"
                                    name="numeroTarjeta"
                                    maxlength="19"
                                    placeholder="1234 5678 9012 3456"
                                    pattern="[0-9]{4}\s[0-9]{4}\s[0-9]{4}\s[0-9]{4}" 
                                    required
                                    tabindex="4">
                            </div>
            
                            <div class="form-filas">
                                <label for="caducidad">Fecha de caducidad</label>
                                <input
                                    type="month"
                                    id="caducidad"
                                    name="caducidad"
                                    required
                                    tabindex="5">
                            </div>
            
                            <div class="form-filas">
                                <label for="cvc">Código CVC</label>
                                <input
                                    type="password"
                                    id="cvc"
                                    name="cvc"
                                    size=1" 
                                    maxlength="3"
                                    placeholder="123"
                                    pattern="[0-9]{3}"
                                    required
                                    title="Codigo"
                                    tabindex="6">
                            </div>
                        </div>

                    </div>
                </section>

                <section>

                    <!-- ========================================
                    OPCIONES DE CONDICIONES Y SUBSCRIPCIONES
                    ======================================== -->
                    <div>
                        <input
                            type="checkbox"
                            id="condiciones"
                            name="condiciones"
                            required
                            tabindex="7">

                        <label for="condiciones">
                            He leído y acepto las condiciones legales y la política de privacidad.
                        </label>
                    </div>

                    <div>
                        <input
                            type="checkbox"
                            id="newsletter"
                            name="newsletter"
                            tabindex="8">

                        <label for="newsletter">
                            Deseo suscribirme a la newsletter y recibir ofertas y promociones.
                        </label>
                    </div>

                </section>

                <!-- ========================================
                BOTON
                ======================================== -->
                <button type="submit" tabindex="9">
                    Confirmar Reserva
                </button>

            </form>
        </div>

    </main>
        
    <footer>
        · © (2026) · Desenvolupado por Oscar · Todos los derechos reservados ·
    </footer>
    
</body>
    
</html>
