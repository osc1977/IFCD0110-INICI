<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinion</title>

    <!--  ==================================================
    LIBRERIAS
    ==================================================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--  ==================================================
    HOJAS DE ESTILO
    ==================================================== -->
    <link rel="stylesheet" href="./css/Template-GRID.css">
    <link rel="stylesheet" href="./css/sty-form.css">

    <link rel="icon" href="./img/logo.svg" type="image/x-icon" />
</head>
    
<body>
    
    <header>
        Formulario Opinion del cliente
    </header>
        
    <main>
        <div class="caixa-form-gr">
            <form action="./Index.html" method="get" target="_blank">
                
                <h1>Déjanos tu opinión</h1>
                
                <!-- ========================================
                TEMA
            ======================================== -->
            <div class="form-filas">
                <label for="tema">Tema</label>
                <input
                type="text"
                    id="tema"
                    name="tema"
                    placeholder="Ej. Atención al cliente"
                    required
                    title="Escribe aquí tu tema"
                    tabindex="1">
            </div>
    
            <!-- ========================================
            OPINION ESCRITA
            ======================================== -->
            <div class="form-filas">
                <label for="opinion">Opinión</label>
                <textarea
                    id="opinion"
                    name="opinion"
                    cols="50"
                    rows="6"
                    placeholder="Escribe aquí tu opinión..."
                    maxlength="250" 
                    pattern="" 
                    required
                    title="Escribe aquí tu opinión..."
                    tabindex="2"></textarea>
            </div>
    
            <!-- ========================================
            VALORACION
            ======================================== -->
            <div class="form-filas">
                <label>Valoración</label>
    
                <div>
    
                    <label>
                        <input
                            type="radio"
                            name="rating"
                            value="1"
                            required
                            tabindex="3">
                        <span>1 ★</span>
                    </label>
    
                    <label>
                        <input
                            type="radio"
                            name="rating"
                            value="2"
                            tabindex="4">
                        <span>2 ★★</span>
                    </label>
    
                    <label>
                        <input
                            type="radio"
                            name="rating"
                            value="3"
                            tabindex="5">
                        <span>3 ★★★</span>
                    </label>
    
                    <label>
                        <input
                            type="radio"
                            name="rating"
                            value="4"
                            tabindex="6">
                        <span>4 ★★★★</span>
                    </label>
    
                    <label>
                        <input
                            type="radio"
                            name="rating"
                            value="5"
                            tabindex="7">
                        <span>5 ★★★★★</span>
                    </label>
    
                </div>
            </div>
    
            <!-- ========================================
            BOTON SUBMIT
            ======================================== -->
            <button type="submit" tabindex="8">
                Enviar opinión
            </button>
    
        </form>
    </div>
    

    </main>
        
    <footer>
        · © (2026) · Desenvolupado por Oscar · Todos los derechos reservados ·
    </footer>
    
</body>
    
</html>
