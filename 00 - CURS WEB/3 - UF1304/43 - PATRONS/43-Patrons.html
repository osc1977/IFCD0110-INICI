<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercici patrons</title>

    <!--  ==================================================
    LIBRERIAS
    ==================================================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--  ==================================================
    HOJAS DE ESTILO
    ==================================================== -->
    <link rel="stylesheet" href="./css/Template-GRID.css">
    <link rel="stylesheet" href="./css/43-Patrons.css">

    <link rel="icon" href="./img/logo.svg" type="image/x-icon" />
</head>
    
<body onload="msgBenvinguda()">
    
    <header>
        Exercici per veure patrons 
    </header>
    
    <nav>
        <ul>
            <li>Opcio1</li>
            <li>Opcio2</li>
            <li>Opcio3</li>
            <li>Opcio4</li>
        </ul>
    </nav>
    
    <main>
        <form action="https://ojoseeu.wordpress.com/" method="get" target="_blank">

            <!-- ========================================
             TELEFON
             ======================================== -->
            <label for="telefon">Telèfon</label>
            <input type="tel" list="tel-list" id="telefon" name="telefon" minlength="10" maxlength="10" placeholder="123-456789" pattern="[0-9]{3}-[0-9]{6}">
            <datalist id="tel-list">
                <option value="555-0100"></option>
                <option value="555-0101"></option>
            </datalist>
            
            <br><br><br><br>
            <!-- ========================================
             NOMBRE
             ======================================== -->
            <label for="nom">Nom:</label>
            <input type="text" name="nom" id="nom" size="10" minlength="2" maxlength="10" pattern="[a-zA-Z]{2,10}" title="No et passis de 10 caracters, i no posis numeros" placeholder="Nom" >
            
            <br><br><br><br>
            <!-- ========================================
             EXEMPLE
             ======================================== -->
            <label for="Exemple">Exemple:</label>
            <input type="text" name="Exemple" id="Exemple" minlength="2" maxlength="11" pattern="[A-Za-z]{4}-(vil|sad)-[0-9]{2}" placeholder="Exemple" >
            
            <br><br><br><br>
            <!-- ========================================
             COINCIDIR
             ======================================== -->
            <label for="Coincidir">Coincidir:</label>
            <input type="text" name="Coincidir" id="Coincidir" maxlength="1" pattern="[a|b]" placeholder="Coincidir" >


            <br><br><br><br>
            <!-- ========================================
             EMAIL
             ======================================== -->
            <label for="email">Correu electronic:</label>
            <input type="text" name="email" id="email" placeholder="email@gmail.com" minlength="2" maxlength="20" pattern="[0-9A-Za-z]+(\.*[0-9A-Za-z]+)@[a-zA-Z0-9]+\.[a-zA-Z]{2,3}">

            <br><br><br><br>
            <!-- ========================================
             PASSWORD
             ======================================== -->
            <label for="password">Password*</label>
            <input type="text" id="password" name="password" maxlength="12" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{12,}" title="Mínimo 12 caracteres: una mayúscula, una minúscula, un número y un carácter especial (@$!%*?&)">

            <br><br><br><br>
            <!-- ========================================
             MATRICULA
             ======================================== -->
            <label for="Matricula">Matricula:</label>
            <input type="text" name="Matricula" id="Matricula" size="7" minlength="7" maxlength="7" 
            pattern="[0-9]{4}[B-DF-HJ-NP-TV-Z]{3}" 
            title="No et passis de 10 caracters, i no posis numeros" placeholder="Matricula" >

            <br><br><br><br>
            <!-- ========================================
             BOTON ENVIAR
             ======================================== -->
            <input type="submit" value="Enviar consulta">
        </form>
        
    </main>
    
    <aside>
        Banners
    </aside>
    
    <footer>
        · ©(2026) · Desenvolupado por Oscar · Todos los derechos reservados ·
    </footer>

    <script src="./js/43-patrons.js"></script>
    
</body>
    
</html>
